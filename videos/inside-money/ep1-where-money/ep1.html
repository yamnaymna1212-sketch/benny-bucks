const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,k01=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const T=A;const tEnd=DUR;
function hero(t){ // returns the main moving thing + its position (camera follows it)
 if(t>=T.when-.2&&t<T.that+.3){const k=k01(t,T.when,T.changes+.4);return {p:pDeposit.getPointAt(k),o:nums[0]};}
 if(t>=T.lends&&t<T.since){const xs=[9.5,14.5,20.5],ts=[T.car,T.home,T.biz];let i=t<T.home-.1?0:t<T.biz-.1?1:2;const k=k01(t,ts[i]-.75,ts[i]+.15);return {p:pLoan(xs[i]).getPointAt(k),o:nums[1+i]};}
 if(t>=T.banks&&t<T.own){const k=k01(t,T.truck-.6,T.fed1+.9);return {p:V3(-15.5+(-1.2+15.5)*k,1.0,2.1),o:truck};}
 if(t>=T.own&&t<T.so2){const k=k01(t,T.own+.2,T.fed2+.8);return {p:pReserve.getPointAt(k),o:nums[4]};}
 return null;}
// camera beats: [start, lookTarget fn, view dir, base distance, objects that must stay fully in frame]
const guyBox=()=>new THREE.Box3().setFromObject(guy);
const boxOf=o=>new THREE.Box3().setFromObject(o);
const vaultBox=new THREE.Box3(V3(-3.3,-6.4,-2),V3(3.3,-2.1,2.5)),bankBox=boxOf(bank),fedBox=boxOf(fed),houseBox=boxOf(house),shopBox=boxOf(shop),carBox=boxOf(car),serverBox=new THREE.Box3(V3(4.0,-4.7,-1),V3(8.8,-2.1,2.5));
const beats=[
 [0,      t=>V3(-2.2,-1.6,0), V3(.18,.06,1), 20, ()=>[guyBox(),bankBox,vaultBox]],          // HOOK: guy + bank + vault in one frame
 [2.6,    t=>V3(-1.8,-1.2,0), V3(.1,.05,1), 19, ()=>[guyBox(),bankBox,vaultBox]],           // slow push
 [T.vault1,t=>V3(0,-2.4,0),   V3(0,.02,1), 30, ()=>[bankBox,vaultBox]],                     // bank + vault below
 [T.lets, t=>V3(0,-4.0,0),    V3(.1,0,1), 12, ()=>[vaultBox]],                              // dive into vault
 [T.yes,  t=>V3(-1.0,-5.0,0), V3(-.25,.08,1), 8.5, ()=>[]],                                // shelves (small part)
 [T.so1,  t=>V3(3.4,-3.6,0),  V3(.3,.05,1), 13, ()=>[]],                                    // turn toward the exit
 [T.most, t=>V3(-3.6,1.4,0),  V3(.2,.05,1), 10, ()=>[guyBox()]],                            // guy: "never cash"
 [T.when-.2,t=>hero(t)?hero(t).p:V3(0,0,0),V3(.15,.06,1), 9, ()=>[]],                        // FOLLOW the number
 [T.that+.3,t=>V3(6.4,-3.3,0),V3(.2,.04,1), 10, ()=>[serverBox]],                          // number on the bank screen
 [T.lends,t=>hero(t)?hero(t).p:V3(6,0,0),V3(.1,.08,1), 11, ()=>[]],                         // FOLLOW loans
 [T.car+.2,t=>hero(t).p.clone().setY(.9),V3(.1,.06,1), 12, ()=>[carBox]],
 [T.home+.2,t=>hero(t).p.clone().setY(1.6),V3(.1,.06,1), 13, ()=>[houseBox]],
 [T.biz+.2,t=>hero(t).p.clone().setY(1.6),V3(.1,.06,1), 13, ()=>[shopBox]],
 [T.since,t=>V3(0,-4.0,0),    V3(-.1,.02,1), 13, ()=>[vaultBox]],                           // back to the vault
 [T.zero-.2,t=>V3(0,-4.2,0),  V3(.05,0,1), 9, ()=>[zero.visible?boxOf(zero):vaultBox]],      // 0%
 [T.wait, t=>V3(-3.4,1.5,0),  V3(.3,.08,1), 9, ()=>[guyBox()]],                             // guy at the ATM
 [T.banks,t=>hero(t)?hero(t).p.clone().setY(1.2):V3(-10,1,0),V3(.12,.1,1), 13, ()=>[]],     // FOLLOW the armored truck
 [T.fed1-.3,t=>V3(-12,2.2,0), V3(.05,.1,1), 22, ()=>[fedBox]],                              // Federal Reserve building
 [T.own,  t=>hero(t)?hero(t).p:V3(0,-2,0),V3(.1,.06,1), 11, ()=>[]],                        // FOLLOW reserves to the Fed
 [T.fed2+.6,t=>V3(-15.5,-2.6,0),V3(.1,.05,1), 14, ()=>[new THREE.Box3(V3(-19.4,-4.7,-1),V3(-11.6,-2.1,2.5))]],
 [T.so2,  t=>V3(-1,0,0),      V3(.05,.08,1), 46, ()=>[fedBox,bankBox,carBox]],              // wide: money moving
 [T.insured,t=>V3(0,4.5,0),   V3(.05,.05,1), 20, ()=>[bankBox]],                            // $250,000 over the bank
 [T.cta,  t=>V3(-4.4,1.9,1),  V3(.35,.12,1), 6.5, ()=>[]],                                  // loop: back to the guy
 [tEnd+1, t=>V3(-4.4,1.9,1),  V3(.35,.12,1), 6.0, ()=>[]]];
const cam=new THREE.PerspectiveCamera(30,W/H,.1,4000);
function fits(boxes){cam.updateMatrixWorld();const v=new THREE.Vector3();for(const b of boxes){for(let i=0;i<8;i++){v.set(i&1?b.max.x:b.min.x,i&2?b.max.y:b.min.y,i&4?b.max.z:b.min.z).project(cam);if(v.z>1||Math.abs(v.x)>.86||v.y>.86||v.y<-.62)return false;}}return true;}
function rawCam(t){let i=0;while(i<beats.length-1&&t>=beats[i+1][0])i++;const [t0,tf,dir,dist,objs]=beats[i];
 const tgt=tf(t),d=dir.clone().normalize();const orbit=Math.sin(t*.35)*.12;d.applyAxisAngle(V3(0,1,0),orbit);   // never static: slow orbit
 let D=dist;const bx=objs();for(let n=0;n<40;n++){cam.position.copy(tgt).addScaledVector(d,D);cam.lookAt(tgt);if(!bx.length||fits(bx))break;D*=1.06;}
 return {pos:cam.position.clone(),tgt};}
// precompute a smooth camera track (critically damped follow) so motion is continuous, never jerky, never frozen
function stateAt(t){applyState(t);}
const FPS=30,NF=Math.ceil(DUR*FPS)+2,track=[];
{let p=null,g=null,vp=V3(0,0,0),vg=V3(0,0,0),fb=0;const dt=1/FPS;
 for(let f=0;f<NF;f++){const t=f/FPS;applyState(t);const r=rawCam(t);if(!p){p=r.pos.clone();g=r.tgt.clone();}
  const hf=!!hero(t);for(const [x,v,tg,w] of [[p,vp,r.pos,hf?9:6],[g,vg,r.tgt,hf?18:7]]){const a=tg.clone().sub(x).multiplyScalar(w*w).addScaledVector(v,-2*w);v.addScaledVector(a,dt);x.addScaledVector(v,dt);}
  fb=Math.min(1,Math.max(0,fb+(hf?1:-1)*dt/.45));
  if(fb>=1){p.copy(r.pos);g.copy(r.tgt);vp.set(0,0,0);vg.set(0,0,0);}
  track.push([p.clone().lerp(r.pos,fb),g.clone().lerp(r.tgt,fb)]);}}
// ================= SCENE STATE =================
function applyState(t){
 // guy: talks with small gestures, looks toward what he talks about
 const talk=Math.sin(t*2.3)*.04;pose(bSpine,0,Math.sin(t*.6)*.05,0);
 const point=(t>T.most&&t<T.when)||(t>T.wait&&t<T.banks)||(t>T.cta);
 pose(bUA_R,point?-.55:0,0,.6-(point?.25:0));pose(bUA_L,0,0,-.6);pose(bLA_R,point?-.9+talk:-.15+talk,0,0);
 pose(bHead,talk*.5,(t>T.vault1&&t<T.most)?-.5:Math.sin(t*.8)*.12,0);
 // flag
 {const p=fg.attributes.position;for(let i=0;i<p.count;i++){const X=fgY[i*3],Y=fgY[i*3+1],a=X/1.8;p.setZ(i,Math.sin(X*4-t*7+Y*1.3)*.11*a+Math.sin(X*7-t*11)*.03*a);}p.needsUpdate=true;fg.computeVertexNormals();}
 // numbers
 nums.forEach(n=>n.visible=false);
 const h=hero(t);if(h&&h.o!==truck){h.o.visible=true;h.o.position.copy(h.p);h.o.rotation.y=Math.sin(t*2)*.25;}
 for(let i=0;i<3;i++){const ts=[T.car,T.home,T.biz][i];if(t>=ts+.15&&t<T.since){const n=nums[1+i];n.visible=true;n.position.copy(pLoan([9.5,14.5,20.5][i]).getPointAt(1));n.position.y+=Math.sin(t*3+i)*.06;}}
 if(t>=T.so2&&t<T.insured+.5){for(let i=0;i<6;i++){const n=nums[i];n.visible=true;n.position.copy(pLoop.getPointAt(((t-T.so2)*.11+i/6)%1));}}
 // truck drives from the Fed to the bank
 {const k=k01(t,T.truck-.6,T.fed1+.9);truck.position.set(t<T.truck-.6?-15.5:-15.5+(-1.2+15.5)*k,0,2.1);}
 zero.visible=t>=T.zero-.05&&t<T.wait;zero.scale.setScalar(zero.visible?Math.min(1,.4+(t-T.zero+.05)*4):1);zero.rotation.y=Math.sin(t*1.5)*.15;
 big.visible=t>=T.insured+.6&&t<T.cta;big.scale.setScalar(big.visible?Math.min(1,.4+(t-T.insured-.6)*4):1);
 house.userData.win.emissiveIntensity=t>T.home?1.1:0;atmScreen.material.emissiveIntensity=1.3+.4*Math.sin(t*6);
 screens.forEach(s=>s.material.emissiveIntensity=(t>T.changes&&t<T.lends)||(t>T.fed2&&t<T.so2)?2.2:1);
 wheel.rotation.z=t*.15;}

const comp=new EffectComposer(renderer);comp.setPixelRatio(PR);comp.setSize(W,H);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.18,.4,.92));comp.addPass(new OutputPass());

void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,1.18);c=c*c*(3.-2.*c)*.3+c*.7;float d=distance(vUv,vec2(.5));c*=1.-smoothstep(.45,1.,d)*.32;c+=(h(vUv*900.)-.5)*.015;gl_FragColor=vec4(c,1.);}`}));

Object.assign(sun.shadow.camera,{left:-26,right:26,top:16,bottom:-14,near:1,far:120});sun.shadow.bias=-.0002;sun.shadow.normalBias=.02;scene.add(sun);
