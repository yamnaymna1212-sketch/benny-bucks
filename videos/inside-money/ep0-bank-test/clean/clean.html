{const p=fg.attributes.position;for(let i=0;i<p.count;i++){const X=p.getX(i),Y=p.getY(i),a=X/1.8;p.setZ(i,Math.sin(X*4-.6*7+Y*1.3)*.11*a+Math.sin(X*7-4)*.03*a);p.setY(i,Y-a*a*.08);}fg.computeVertexNormals();}
