 [DUR,         V(-4.4,1.4,36),  V(-4.8,-1.6,0)]];
const posC=new THREE.CatmullRomCurve3(KEYS.map(k=>k[1]),false,'centripetal'),tgtC=new THREE.CatmullRomCurve3(KEYS.map(k=>k[2]),false,'centripetal');
function camParam(t){const n=KEYS.length-1;for(let i=0;i<n;i++){const a=KEYS[i][0],b=KEYS[i+1][0];if(t<=b){const u=(t-a)/(b-a);return (i+u)/n;}}return 1;}
const cam=new THREE.PerspectiveCamera(28,W/H,.1,4000);
// ---------- post ----------
const comp=new EffectComposer(renderer);comp.setSize(W,H);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.15,.5,.95));
const fx=new ShaderPass({uniforms:{tDiffuse:{value:null},seed:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform sampler2D tDiffuse;uniform float seed;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){vec4 c=texture2D(tDiffuse,vUv);float d=distance(vUv,vec2(.5));c.rgb*=1.-smoothstep(.38,.95,d)*.38;c.rgb+=(h(vUv*900.+seed)-.5)*.025;c.rgb*=vec3(1.03,1.0,.96);gl_FragColor=c;}'});
comp.addPass(fx);comp.addPass(new OutputPass());
// ---------- frame ----------
const cap=document.getElementById('cap'),big=document.getElementById('big'),sub=document.getElementById('sub');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const pop=x=>{x=clamp(x);return x<1?1+Math.sin(x*Math.PI)*.35*(1-x)+ (1-Math.pow(1-x,3))-1:1;};
window.renderAt=(t)=>{
 const q=camParam(t);cam.position.copy(posC.getPoint(q));cam.lookAt(tgtC.getPoint(q));
 // deposit bundle
 const d0=P[1]+.35,d1=P[2]-.05;dep.visible=t>=d0;if(dep.visible){const k=ease(clamp((t-d0)/(d1-d0)));dep.position.copy(depPath.getPointAt(k));dep.rotation.y=k*6;const ar=t-d1;dep.scale.setScalar(k<.1?2.4-14*k:(ar>0?1+1.3*(1-Math.exp(-ar*6)):1));}
 // loans leave vault
 loans.forEach((L,i)=>{const s=P[2]+.15+i*.12,e=P[3+i]+.05;L.g.visible=t>=s;if(L.g.visible){const k=ease(clamp((t-s)/(e-s)));L.g.position.copy(L.path.getPointAt(k));
  const after=t-e;const sc=after>0?1+1.6*(1-Math.exp(-after*9))+Math.sin(after*14)*.25*Math.exp(-after*5):1;L.g.scale.setScalar(sc);L.g.rotation.y=k*5+(after>0?after*1.5:0);}});
 // vault empties as loans go out
 const empt=clamp((t-(P[2]+.1))/1.8);stacks.forEach((s,i)=>{const th=i/9;const v=i===0?1:clamp(1-(empt-th*.9)*4);s.scale.setScalar(Math.max(.0001,v));});
 // targets react
 const bump=(g,t0)=>{const a=t-t0;g.scale.setScalar(a>0&&a<.5?1+Math.sin(a/.5*Math.PI)*.06:1);};
 bump(car,P[3]+.05);bump(house,P[4]+.05);bump(shop,P[5]+.05);
 house.userData.win.emissiveIntensity=t>P[4]+.05?1.2:0;
 // arrows pulse
 arrows.forEach((a,i)=>{a.material.opacity=.55+.45*Math.sin(t*8-i*.9);});
 wheel.rotation.z=t>P[7]?-(t-P[7])*1.2:0;scrMat.emissiveIntensity=1.2+.4*Math.sin(t*6);
 // captions: word by word, no gaps
 let w=TL.words[0];for(const x of TL.words){if(t>=x.s)w=x;}cap.textContent=w.w;
 const wa=t-w.s;cap.style.transform=`scale(${wa<.12?.85+wa/.12*.15:1})`;
 // 0% reveal
 const zt=TL.zeroAt;const za=t-zt;const zon=za>0&&t<P[8]+.05;big.style.opacity=zon?1:0;sub.style.opacity=zon?1:0;big.style.transform=`scale(${za>0?Math.max(.6,pop(za/.35)):0})`;
 fx.uniforms.seed.value=t*37.0;
 comp.render();return true;};
window.renderAt(0);document.title='ready';
</script></body></html>
