<script type="module">

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});

const bg=document.createElement('canvas');bg.width=4;bg.height=256;const bgx=bg.getContext('2d');const bgg=bgx.createLinearGradient(0,0,0,256);bgg.addColorStop(0,'#5b9be0');bgg.addColorStop(.6,'#a9cdee');bgg.addColorStop(1,'#e3eef7');bgx.fillStyle=bgg;bgx.fillRect(0,0,4,256);const bgt=new THREE.CanvasTexture(bg);bgt.colorSpace=THREE.SRGBColorSpace;scene.background=bgt;
// strata soil front face (world-mapped)
const GX=9,GD=5,GY=9;
function soilTex(){const S=2048,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,0,S);[[0,'#3a2415'],[.08,'#4d311b'],[.11,'#8a5a2c'],[.4,'#9a6630'],[.6,'#a8743c'],[1,'#8a6a4a']].forEach(a=>g.addColorStop(a[0],a[1]));

x.fillStyle=t<.45?`rgba(60,32,10,${.1+rnd()*.25})`:t<.8?`rgba(215,150,85,${.08+rnd()*.2})`:`rgba(110,64,28,${.12+rnd()*.2})`;
x.save();x.translate(px,py);x.rotate((rnd()-.5)*.45+Math.PI/2);x.fillRect(-wd/2,0,wd,l);x.restore();}
for(let i=0;i<75;i++){const px=rnd()*S,py=S*.14+rnd()*S*.84,r=10+rnd()*(py>S*.5?55:30);

x.strokeStyle='#2a190d';x.lineCap='round';for(let i=0;i<16;i++){x.lineWidth=3+rnd()*6;x.beginPath();let px=rnd()*S,py=0;x.moveTo(px,py);for(let k=0;k<5;k++){px+=(rnd()-.5)*90;py+=30+rnd()*50;x.lineTo(px,py);}x.stroke();}

const ST=soilTex();

const M=(c,r=.6,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

const RB=(w,h,d,r=.04)=>new RoundedBoxGeometry(w,h,d,3,r);
function soilBox(x0,x1,y0,y1){const g=new THREE.BoxGeometry(x1-x0,y1-y0,GD),cx=(x0+x1)/2,cy=(y0+y1)/2,p=g.attributes.position,uv=g.attributes.uv;

// grass top

for(let i=0;i<16;i++){gx.fillStyle=i%2?'#5aa23a':'#4d9632';gx.fillRect(0,i*32,512,32)}
for(let i=0;i<6000;i++){gx.fillStyle=`rgba(${rnd()<.5?'30,80,20':'140,200,90'},.18)`;gx.fillRect(rnd()*512,rnd()*512,1,3)}
const gt=new THREE.CanvasTexture(gc);gt.colorSpace=THREE.SRGBColorSpace;
const grass=add(new THREE.PlaneGeometry(GX,GD),new THREE.MeshStandardMaterial({map:gt,roughness:1}),0,.005,0,false);grass.rotation.x=-Math.PI/2;
// grass blades
const bl=new THREE.InstancedMesh(new THREE.ConeGeometry(.025,.16,4),M(0x4f9a35,.9),5000),dm=new THREE.Object3D();
for(let i=0;i<5000;i++){const x=(rnd()-.5)*GX,z=(rnd()-.5)*GD;dm.position.set(x,.08,z);dm.rotation.set((rnd()-.5)*.4,rnd()*6,(rnd()-.5)*.4);const s=.7+rnd()*.8;dm.scale.set(s,s,s);dm.updateMatrix();bl.setMatrixAt(i,dm.matrix);}

// sidewalk + steps
add(RB(GX,.1,1.0,.02),M(0xbdbab2,.9),0,.05,1.95);
// bank
const bx=-2.35,bz=-.5,mar=M(0xcdc6b6,.5),mar2=M(0xbdb6a6,.55);
add(RB(4.4,.12,3.0,.03),mar2,bx,.06,bz+.1);add(RB(4.1,.12,2.7,.03),mar,bx,.18,bz+.1);
add(RB(3.7,2.5,2.2,.05),M(0xd2c9b4,.75),bx,1.55,bz-.1);
for(let i=0;i<6;i++){const x=bx-1.5+i*.6;add(new THREE.CylinderGeometry(.14,.14,2.15,24),mar,x,1.43,bz+1.2);add(RB(.4,.1,.4,.02),mar,x,.3,bz+1.2);add(RB(.4,.1,.4,.02),mar,x,2.5,bz+1.2);}
add(RB(4.1,.35,.7,.03),mar,bx,2.75,bz+1.2);
const ps=new THREE.Shape();ps.moveTo(-2,0);ps.lineTo(2,0);ps.lineTo(0,.8);ps.closePath();
const ped=add(new THREE.ExtrudeGeometry(ps,{depth:.55,bevelEnabled:false}),mar,bx,2.92,bz+.95);
add(RB(3.9,.3,2.4,.03),M(0x4a4f57,.6),bx,2.85,bz-.1);
const sgc=document.createElement('canvas');sgc.width=512;sgc.height=128;const sg=sgc.getContext('2d');sg.fillStyle='#14532d';sg.fillRect(0,0,512,128);sg.strokeStyle='#d9b45a';sg.lineWidth=6;sg.strokeRect(6,6,500,116);sg.fillStyle='#e8c76a';sg.font='bold 86px Georgia';sg.textAlign='center';sg.fillText('BANK',256,95);
const sgt=new THREE.CanvasTexture(sgc);sgt.colorSpace=THREE.SRGBColorSpace;add(RB(1.9,.5,.06,.01),new THREE.MeshStandardMaterial({map:sgt,roughness:.4,metalness:.2}),bx,2.75,bz+1.6);
const glass=new THREE.MeshPhysicalMaterial({color:0x1d3550,roughness:.05,metalness:.1,clearcoat:1,reflectivity:.9});
for(let i=0;i<5;i++){if(i===2)continue;add(RB(.34,1.2,.05,.01),glass,bx-1.2+i*.6,1.35,bz+1.05);}
add(RB(.42,1.3,.06,.01),M(0x4b2f19,.6),bx-.07,.95,bz+1.05);add(RB(.42,1.3,.06,.01),M(0x4b2f19,.6),bx+.37,.95,bz+1.05);
// ATM kiosk
const kx=2.3;add(RB(1.1,1.7,.9,.06),M(0x2b3138,.4,.3),kx,.95,1.0);
const scr=new THREE.MeshStandardMaterial({color:0x0b2a4a,emissive:0x3b9cff,emissiveIntensity:1.3,roughness:.3});add(RB(.78,.55,.05,.01),scr,kx,1.35,1.46);
add(RB(.8,.22,.3,.03),M(0x8a9097,.3,.7),kx,.95,1.38);add(RB(.5,.07,.05,.01),M(0x050505,.5),kx,.7,1.46);
// lamp
add(new THREE.CylinderGeometry(.04,.05,2.4,12),M(0x2a2e33,.5,.5),.7,1.2,1.9);add(RB(.5,.05,.05,.01),M(0x2a2e33,.5,.5),.9,2.38,1.9);
add(new THREE.SphereGeometry(.09,16,16),new THREE.MeshStandardMaterial({color:0xfff3c4,emissive:0xffe9a0,emissiveIntensity:2}),1.12,2.33,1.9);
// trees
function tree(x,z,s){add(new THREE.CylinderGeometry(.1*s,.16*s,1.1*s,10),M(0x5b3a1f,1),x,.55*s,z);
for(let i=0;i<7;i++)add(new THREE.IcosahedronGeometry((.45+rnd()*.25)*s,2),M(i%2?0x2f7d32:0x3b8f3c,.9),x+(rnd()-.5)*.7*s,1.5*s+(rnd()-.3)*.6*s,z+(rnd()-.5)*.5*s);}
tree(3.9,-1.4,1.1);tree(-4.0,-1.6,.9);
// glass pipe
const pz=GD/2-.12,pr=.22,py=-4.2;
const tube=new THREE.MeshPhysicalMaterial({color:0xcfe8ff,roughness:.05,metalness:0,transparent:true,opacity:.38,clearcoat:1});
add(new THREE.CylinderGeometry(pr,pr,py*-1-.0,32,1,true),tube,kx,py/2,pz,false);
add(new THREE.SphereGeometry(pr,32,32),tube,kx,py,pz,false);
const hl=kx-cx1;const hp=add(new THREE.CylinderGeometry(pr,pr,hl,32,1,true),tube,(kx+cx1)/2,py,pz,false);hp.rotation.z=Math.PI/2;
const gold=new THREE.MeshStandardMaterial({color:0xf0c040,roughness:.28,metalness:1,emissive:0x4a3300,emissiveIntensity:.35});
for(let i=0;i<5;i++){const c=add(new THREE.CylinderGeometry(.15,.15,.05,32),gold,kx,-.8-i*.7,pz,false);c.rotation.x=Math.PI/2;}
for(let i=0;i<5;i++){const c=add(new THREE.CylinderGeometry(.15,.15,.05,32),gold,kx-.5-i*.62,py,pz,false);c.rotation.z=Math.PI/2;c.rotation.x=0;}
const arr=(x,y,r)=>{const a=add(new THREE.ConeGeometry(.3,.62,24),M(0xffffff,.4),x,y,pz+.35,false);a.rotation.z=r;};
arr(kx,-1.9,Math.PI);arr(kx,-3.2,Math.PI);arr(kx-1.0,py,Math.PI/2);arr(kx-2.2,py,Math.PI/2);
// vault room
const conc=M(0x9fa3a6,.9),vx=(cx0+cx1)/2,vz=-GD/2+.4;
add(RB(cx1-cx0,cy1-cy0,.3,.02),conc,vx,(cy0+cy1)/2,vz-.2);
add(RB(cx1-cx0,.3,GD-.2,.02),M(0x6e7377,.8),vx,cy0+.15,0);
add(RB(.2,cy1-cy0,GD-.4,.02),M(0x8a8f93,.9),cx0+.12,(cy0+cy1)/2,-.1);
// safe deposit wall (left)
const sdb=M(0x9aa3ab,.35,.8);for(let r=0;r<6;r++)for(let c=0;c<5;c++){add(RB(.04,.34,.4,.01),sdb,cx0+.25,cy0+.5+r*.5,-1.55+c*.62);add(new THREE.SphereGeometry(.035,10,10),gold,cx0+.29,cy0+.5+r*.5,-1.55+c*.62);}
// vault door
const steel=new THREE.MeshStandardMaterial({color:0xa9b2bb,roughness:.3,metalness:1});
const vcy=cy0+1.95;
const dsk=add(new THREE.CylinderGeometry(1.2,1.2,.3,64),steel,vx+.35,vcy,vz);dsk.rotation.x=Math.PI/2;

add(new THREE.TorusGeometry(.42,.05,16,48),gold,vx+.35,vcy,vz+.28);
for(let i=0;i<4;i++){const s=add(RB(.9,.07,.07,.01),gold,vx+.35,vcy,vz+.28);s.rotation.z=i*Math.PI/4;}
add(new THREE.CylinderGeometry(.16,.16,.2,24),gold,vx+.35,vcy,vz+.3).rotation.x=Math.PI/2;
// cash + gold bars
const bill=M(0x4f9a58,.75),band=M(0xf0e6c8,.7);
for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=cx0+.9+c*.78,y=cy0+.3+.24+r*.5;add(RB(.66,.46,.72,.02),bill,x,y,1.15);add(RB(.68,.1,.74,.02),band,x,y,1.15);}
const bars=[4,3,2,1];bars.forEach((n,r)=>{for(let c=0;c<n;c++){add(RB(.52,.26,.9,.04),gold,vx+.3+1.0+(c-(n-1)/2)*.58,cy0+.3+.13+r*.27,1.25);}});
// lights
const sun=new THREE.DirectionalLight(0xfff0d8,1.9);sun.position.copy(sunDir).multiplyScalar(30);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:80});sun.shadow.bias=-.0003;sun.shadow.normalBias=.03;scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x8a6a4a,.35));
const cl=new THREE.PointLight(0xffe2b0,22,10,1.6);cl.position.set(vx,cy1-.5,2.4);cl.castShadow=true;cl.shadow.mapSize.set(1024,1024);scene.add(cl);

fragmentShader:'uniform sampler2D tDiffuse;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){vec4 c=texture2D(tDiffuse,vUv);float d=distance(vUv,vec2(.5));c.rgb*=1.-smoothstep(.35,.95,d)*.4;c.rgb+=(h(vUv*900.)-.5)*.03;c.rgb*=vec3(1.03,1.0,.96);gl_FragColor=c;}'}));
