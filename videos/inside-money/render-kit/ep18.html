const herm=(t,arr)=>{let i=0;while(i<arr.length-2&&t>=arr[i+1][0])i++;const a=arr[Math.max(0,i-1)],b=arr[i],c=arr[i+1],d=arr[Math.min(arr.length-1,i+2)];
 const h=c[0]-b[0],u=Math.min(1,Math.max(0,(t-b[0])/h)),u2=u*u,u3=u2*u;return {a,b,c,d,h,h00:2*u3-3*u2+1,h10:u3-2*u2+u,h01:-2*u3+3*u2,h11:u3-u2};};
function hv(t,K,sel){const {a,b,c,d,h,h00,h10,h01,h11}=herm(t,K),out=[];const A=sel(a),Bv=sel(b),C=sel(c),D=sel(d);
 const tg=(dl,dr)=>dl*dr<=0?0:Math.sign(dr)*Math.min(Math.abs(dl+dr)/2,3*Math.abs(dl),3*Math.abs(dr));
 for(let j=0;j<Bv.length;j++){const d1=(C[j]-Bv[j])/h,d0=a===b?d1:(Bv[j]-A[j])/(b[0]-a[0]),d2=c===d?d1:(D[j]-C[j])/(d[0]-c[0]);
  const m0=(a===b?0:tg(d0,d1))*h,m1=(c===d?0:tg(d1,d2))*h;out.push(h00*Bv[j]+h10*m0+h01*C[j]+h11*m1);}return out;}
function setCam(t){const room=t>=tSw,K=room?KR:KY,o=room?V3(RX,0,0):V3(0,0,0);const p=hv(Math.min(t,K[K.length-1][0]),K,k=>k[1]),l=hv(Math.min(t,K[K.length-1][0]),K,k=>k[2]),f=hv(Math.min(t,K[K.length-1][0]),K,k=>[k[3]]);
 cam.position.set(p[0],p[1],p[2]).add(o);cam.up.set(0,1,0);if(!room&&t>tSw-.36)cam.up.set(0,1,0).lerp(V3(0,0,1),sm(tSw-.36,tSw-.05,t)).normalize();cam.fov=f[0];cam.updateProjectionMatrix();cam.lookAt(l[0]+o.x,l[1],l[2]);}

function animate(t){
 // ---- dig: depth grows bucket by bucket, the lawn disappears, dirt pile grows ----
 const dk=sm(-.2,tDigEnd,t),dep=Math.max(.02,P.dep*dk);
 PW.floor.position.y=-dep;for(const k of['n','s','w','e']){PW[k].scale.y=dep;PW[k].position.y=-dep/2;}

 const cy=(t*1.55)%1,dig=t<tDigEnd;const sw=dig?(cy<.45?0:cy<.6?sm(.45,.6,cy):cy<.85?1:1-sm(.85,1,cy)):0;
 TURN.rotation.y=-1.82*sw;
 const L=(a0,a1,u)=>a0+(a1-a0)*u;let bo,ar,bu;
 if(!dig){const k=sm(tDigEnd,tDigEnd+.4,t);bo=L(.2,.55,k);ar=L(.3,.15,k);bu=-.9;}
 else if(cy<.25){const u=sm(0,.25,cy);bo=L(.45,-.35,u);ar=L(.2,.6,u);bu=L(.4,.2,u);}        // reach down into the pit
 else if(cy<.4){const u=sm(.25,.4,cy);bo=-.35;ar=L(.6,.35,u);bu=L(.2,-1.1,u);}               // scoop (curl)
 else if(cy<.85){const u=sm(.4,.55,cy);bo=L(-.35,.45,u);ar=L(.35,.2,u);bu=-1.1;}             // lift + swing
 else{const u=sm(.85,.95,cy);bo=.45;ar=.2;bu=L(-1.1,.6,u);}                                   // dump on the pile
 BOOM.rotation.z=bo;ARMG.rotation.z=ar;BUCK.rotation.z=bu;BDIRT.visible=dig&&cy>.33&&cy<.9;
 EX.position.x=P.x+4.0+2.2*sm(tDigEnd,tDigEnd+.7,t)+.02*Math.sin(t*40)*(dig?1:0);
 for(const c of CLODS){const ph=((cy-.88+1)%1)/.25;const vis=dig&&ph>=0&&ph<1;c.m.visible=vis&&t>.1;if(vis){BUCK.getWorldPosition(_v);c.m.position.set(_v.x+c.dx*ph,_v.y-2.5*ph*ph,_v.z+c.dz*ph);}}
 // ---- yellow ring on "pool" (blinks on, then stays while digging) ----
 const rk=pop(t,tPool,.3)*(1-sm(tFill+.3,tFill+.55,t));RING.visible=rk>.01;RING.scale.setScalar(Math.max(.01,.9+.1*rk));RING.children.forEach(m=>m.material.emissiveIntensity=2.2*(.6+.4*Math.sin(t*14)));
 // ---- the money: straps rain in, 12 layers fill the pit, green glow + the number on "million" ----
 BR.forEach((b,i)=>{const t0=tMS+(tME-tMS)*i/12,k=sm(t0,t0+.16,t);b.visible=t>=t0;b.position.y=b.userData.y+.4*(1-k);});
 const lvl=-P.dep+.03+MSZ.h*12*sm(tMS,tME,t);
 for(const r of RAIN){const t0=tMS-.25+r.u*(tME-tMS),f=t-t0,y=r.y0-4.9*f*f;r.s.visible=f>0&&y>lvl;if(r.s.visible){r.s.position.set(r.x,y,r.z);r.s.rotation.set(r.r+f*3,r.r*2+f*5,f*2);}}
 const gl=sm(tMil-.05,tMil+.2,t)*(1-sm(tLand-.15,tLand,t)),bl=.6+.4*Math.cos((t-tMil)*Math.PI*2);MTOP.emissiveIntensity=.001+.42*gl*bl;MGLOW.intensity=7*gl*bl;
 {const s=pop(t,tMil-.04,.3)*(1-sm(tPut+.1,tPut+.3,t));MIL.visible=s>.01;MIL.scale.setScalar(Math.max(.001,s));MIL.position.set(P.x-.2,1.5+.04*Math.sin(t*2.4),P.z+.5);MIL.quaternion.copy(cam.quaternion);}
 // ---- the armor lid: falls, CLANG, dust, cyan glow outline, the wheel locks ----
 ARM.visible=t>tPut-.2&&t<tSw+.05;if(ARM.visible){const u=Math.min(1,Math.max(0,(t-(tPut-.2))/(tLand-(tPut-.2))));const bo=t>tLand?.05*Math.exp(-(t-tLand)*9)*Math.abs(Math.sin((t-tLand)*28)):0;ARM.position.set(P.x,.02+7*(1-u*u)+bo,P.z);WHEEL.rotation.y=-2.2*sm(tWorld,tTop+.2,t);}
 OUT.selectedObjects=(t>tLand&&t<tSw)?[ARM]:(t>tMil-.05&&t<tPut)?[BR[11]]:[];OUT.edgeStrength=6+3*Math.sin(t*12);
 for(const d of DUST){const f=t-tLand;d.m.visible=f>0&&f<.75;if(d.m.visible){const r=2.1+d.v*f*1.8;d.m.position.set(P.x+Math.cos(d.a)*r*1.05,.15+f*.4,P.z+Math.sin(d.a)*r*.85);d.m.scale.setScalar(1+f*3);d.m.material.opacity=.55*(1-f/.75);}}
 // ---- Mike: directs the digger -> cheers on "million" -> points up at the lid -> thumbs up/proud ----
 const M_=mike;relax(M_);idle(M_,t);M_.g.position.set(P.x-2.4,0,P.z+1.7);M_.g.rotation.y=2.2;
 if(t<tFill){arm(M_,'R',AD[0]+1.3,AD[2]-.25+.25*Math.sin(t*9),.25);pose(M_,'head',.1,-.2,0);face(M_,{smile:.6,jaw:.05});}   // points at the hole, waves the digger on
 const cel=sm(tMil-.1,tMil+.1,t)*(1-sm(tPut-.1,tPut+.1,t));if(cel>0){armsUp(M_,cel);M_.g.position.y=Math.abs(Math.sin((t-tMil)*7))*.14*cel;face(M_,{smile:1.3,jaw:.2});}
 const pu=sm(tPut-.05,tPut+.12,t)*(1-sm(tLand-.08,tLand+.05,t));if(pu>0){arm(M_,'R',AD[0]+.35,AD[2]-2.3*pu,.1);pose(M_,'head',-.5*pu,0,0);face(M_,{jaw:.25});}
 const fl=Math.exp(-Math.pow((t-tLand-.05)*7,2));if(fl>.03){pose(M_,'spine03',-.15*fl,0,0);for(const sd of['L','R'])arm(M_,sd,AD[0]+.9*fl,AD[2]-.6*fl,1.6*fl);}
 const pr=sm(tWorld-.1,tWorld+.15,t);if(pr>0&&fl<.3){arm(M_,'L',AD[0]+.95*pr,AD[2]-.85*pr,1.95*pr);arm(M_,'R',AD[0]+1.2*pr,AD[2]-.6*pr,1.2*pr);M_.BN.fingerR&&0;face(M_,{smile:1.2});pose(M_,'head',-.1*pr,.2*pr,0);}
 // ---- IRS room: feed + reticle, strobes, agents move ----
 const room=t>=tSw-.4;if(room){const z=sm(tSw,DUR,t);SAT.position.set(P.x,30-6*z,P.z-.02);SAT.lookAt(P.x,0,P.z);SAT.updateMatrixWorld();renderer.setRenderTarget(RT);renderer.render(scene,SAT);renderer.setRenderTarget(null);}
 RETM.opacity=t>tIRS?(.6+.4*(Math.sin(t*16)>0?1:0))*sm(tIRS,tIRS+.15,t):0;
 const on=t>tSw,ph=Math.sin(t*Math.PI*2*3.2)>0;BEAC.forEach((b,i)=>{const lit=on&&(i===0?ph:!ph);b.L.intensity=lit?40:0;b.dome.material.emissiveIntensity=lit?4:.4;b.g.rotation.y=t*9;});
 STROBE[0].intensity=on&&ph?18:0;STROBE[1].intensity=on&&!ph?18:0;
 relax(agA);idle(agA,t,1);const ap=sm(tFind-.25,tFind+.05,t);agA.g.rotation.y=.5-.9*ap;arm(agA,'R',AD[0]+.3,AD[2]-2.0*ap,.15);if(ap<.1)arm(agA,'R',AD[0]+.9,AD[2]-.35,1.6);face(agA,{jaw:.15*ap});   // points at the pool on "find"
 relax(agB);idle(agB,t,2);{const tb=sm(tIRS-.1,tIRS+.25,t);agB.g.rotation.y=Math.PI+.9*tb;pose(agB,'head',.05,-.5*tb,0);for(const sd of['L','R'])arm(agB,sd,AD[0]+1.1*(1-tb)+.3*tb,AD[2]-.3,1.5*(1-tb)+.6*tb);face(agB,{jaw:.25*tb});}   // types, then turns to the wall
 relax(agC);{const u=sm(tSw+.1,tFind+.4,t);agC.g.position.set(RX+4.2-3.2*u,0,1.6-1.9*u);agC.g.rotation.y=u<.98?-Math.PI/2-.55*u:-2.5;if(u>0&&u<.98)walk(agC,t*1.3,.5);else idle(agC,t,3);}   // rushes in
