const RDOWN=[.08,0,.85,.06,0,0],RHOLD=JSON.parse(Q.get('pa')||'[0.3,-0.55,0.6,1.3,1.5,0]'),LDOWN=[.08,0,-.85,.06,0,0],LHEAD=JSON.parse(Q.get('la')||'[0.25,0,-0.5,1.35,1.2,0]');
const FC=JSON.parse(Q.get('fc')||'[0.95,0.85,0.5]'),TH=JSON.parse(Q.get('th')||'[0,0,0.2]'),PO=JSON.parse(Q.get('po')||'[0.0,0.15,0.03]');
const mixA=(A,B_,k)=>A.map((v,i)=>lerp(v,B_[i],k));
function applyState(t){
 const br=Math.sin(t*2.1)*.015,sway=Math.sin(t*.9)*.02;
 // beats: raise phone 0.35-1.05 s | double-take on "$120,000" | lean in | left hand to his head on "wasn't" | drops in the flashback
 const raise=ease(clamp((t-.35)/.7)),w1=WS('$120,000'),take=Math.exp(-Math.pow((t-w1-.15)/.22,2)),lean=ease(clamp((t-w1-.5)/.6))*(1-ease(clamp((t-L(2)+.2)/.5)));
 const wn=WS("wasn't")||2.9,hh=ease(clamp((t-wn+.25)/.45))*(1-ease(clamp((t-L(2)-.1)/.5))),shake=hh*Math.sin((t-wn)*9)*.12*Math.exp(-Math.max(0,t-wn-.6)*2);
 guy.rotation.y=-.12+Math.sin(t*.35)*.03;const step=ease(clamp((t-w1-.05)/.35));guy.position.copy(GP).add(V3(sway,0,-.12*step));
 pose('spine01',.04+.08*lean-.06*take,0,sway*2);pose('spine03',.05+br+.06*lean-.08*take,0,0);
 pose('neck01',.05+.17*raise,0,0);const up=Math.exp(-Math.pow((t-wn-.35)/.35,2));pose('head',.08+.26*raise-.25*take+.05*lean-.3*up,shake+Math.sin(t*.7)*.03,0);
 const R=mixA(RDOWN,RHOLD,raise),Lm=mixA(LDOWN,LHEAD,hh);
 pose('upperarm01R',R[0],R[1],R[2]);pose('lowerarm01R',R[3],R[4],R[5]);pose('upperarm01L',Lm[0],Lm[1],Lm[2]);pose('lowerarm01L',Lm[3],Lm[4],Lm[5]);
 pose('upperleg01L',-.02*lean,0,.03+sway);pose('upperleg01R',.02,0,-.04+sway);pose('lowerleg01L',.02,0,0);pose('lowerleg01R',.04+.05*lean,0,0);
 // right hand grip: fingers 2-5 wrap the far edge of the phone, thumb lies along the near edge (per joint: base, middle, tip)
 for(const [o,r] of FING){o.quaternion.copy(r);const m=o.name.match(/finger(\d)-(\d)(R|L)/);let e=[.25+.15*hh,0,0];
  if(m&&m[3]==='R'){const g=raise>.5,ax=Number(Q.get('fax')||0);if(m[1]==='1')e=g?TH:[.3,0,0];else{e=[0,0,0];e[ax]=g?FC[+m[2]-1]:.3;}}
  qx.setFromEuler(E.set(...e));o.quaternion.multiply(qx);}
 guy.updateMatrixWorld(true);
 BN.head.getWorldPosition(headW);headW.y+=.08;
 // phone lies in the palm (palm turned to the eyes): back on the palm, long side along the hand, screen to his eyes
 BN.wristR.getWorldPosition(wR);BN.lowerarm01R.getWorldPosition(laR);const hand=wR.clone().sub(laR).normalize();
 const nrm=headW.clone().sub(wR).normalize().add(V3(0,0,.55)).normalize(),   // screen tilted between his eyes and the viewer
  yAx=hand.clone().addScaledVector(nrm,-hand.dot(nrm)).normalize(),xAx=yAx.clone().cross(nrm).normalize();
 phone.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAx,yAx,nrm));phoneUp.copy(yAx);
 const buzz=t<.9?Math.sin(t*90)*.0025*(Math.sin(t*12)>0?1:0):0;
 phone.position.copy(wR).addScaledVector(xAx,PO[0]).addScaledVector(hand,PO[1]).addScaledVector(nrm,PO[2]+buzz);phoneW.copy(phone.position);eyeDir.copy(nrm).add(V3(-.75,.2,.1)).normalize();   // over his right shoulder
 drawApp(t<L(2)?'now':'before');
 // red numbers: $120,000 pops over his head on the word, $1,100 replaces it in line 2
 const a1=WS('$120,000');n120.visible=false;   // the written hook at the top already carries $120,000
 n120.scale.setScalar(pop(t,a1-.1));n120.position.copy(headW).add(V3(0,.24+Math.sin(t*2)*.01,0));
 const a2=WS('$1,100');n1100.visible=t>a2-.1&&t<L(3);n1100.scale.setScalar(pop(t,a2-.1));n1100.position.copy(headW).add(V3(0,.24,0));
 for(const n of[n120,n1100])n.lookAt(cam.position);
 gradeU.value=(t>=L(2)-.15&&t<L(3)-.1)?.85:0;           // "the day before": desaturated flashback
}
// ================= POST: bloom, depth of field (Zack look), grade =================
const comp=new EffectComposer(renderer);comp.setPixelRatio(PR);comp.setSize(W,H);comp.addPass(new RenderPass(scene,cam));
const bokeh=new BokehPass(scene,cam,{focus:1,aperture:.0035,maxblur:.008});comp.addPass(bokeh);
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.12,.4,.95));comp.addPass(new OutputPass());
const gradeU={value:0};comp.addPass(new ShaderPass({uniforms:{tDiffuse:{value:null},flash:gradeU},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`uniform sampler2D tDiffuse;uniform float flash;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,1.12);float d=distance(vUv,vec2(.5));c*=1.-smoothstep(.45,1.,d)*.3;
c=mix(c,vec3(l)*vec3(1.08,1.,.88),flash);c+=(h(vUv*900.)-.5)*.006;gl_FragColor=vec4(c,1.);}`}));
await loaded;
const cap=document.getElementById('cap'),FPS=30;
window.camAt=t=>{const c=camAtT(t);return [c.pos.toArray().map(v=>+v.toFixed(2)),c.tgt.toArray().map(v=>+v.toFixed(2))];};
window.renderAt=t=>{applyState(t);{const c=camAtT(t);cam.position.copy(c.pos);cam.up.copy(c.up);cam.lookAt(c.tgt);bokeh.uniforms.focus.value=c.pos.distanceTo(c.tgt);}
 if(LINEUP){MAN.root.position.set(-3.1,0,.4);MAN.root.rotation.set(0,0,0);const cx_=Number(Q.get('cx')||0);const ly=Number(Q.get('ly')||1.0);cam.position.set(cx_,ly+.1,Number(Q.get('cz')||7));cam.up.set(0,1,0);cam.lookAt(cx_,ly,0);bokeh.uniforms.focus.value=7;}
 if(Q.get('eye')){cam.position.copy(headW).add(V3(0,.05,.38));cam.lookAt(wR);bokeh.uniforms.focus.value=cam.position.distanceTo(wR);phone.visible=!Q.get('nophone');}
 if(Q.get('dbg')){const d=JSON.parse(Q.get('dbg'));const tg=Q.get('dt')==='head'?headW:wR;cam.position.copy(tg).add(V3(...d));cam.lookAt(tg);bokeh.uniforms.focus.value=cam.position.distanceTo(tg);phone.visible=!Q.get('nophone');}
 {const hk=document.getElementById('hk'),o=t<L(2)-.3?1:clamp(1-(t-L(2)+.3)/.3);hk.style.opacity=o;hk.style.transform=`scale(${t<.25?.9+.1*ease(t/.25):1})`;}
 let w=WD[0];for(const x of WD)if(t>=x.s-.04)w=x;cap.textContent=w.w;cap.className='cap '+(w.c||'');
 const wa=t-w.s;cap.style.transform=`scale(${wa<.08?.86+wa/.08*.14:1})`;
 const glc=renderer.domElement,mb=document.getElementById('mb');if(mb.width!==glc.width){mb.width=glc.width;mb.height=glc.height;}const cx=mb.getContext('2d');
 const c0=camAtT(t-.5/FPS),c1=camAtT(t+.5/FPS),mv=c0.tgt.distanceTo(c1.tgt)/c1.pos.distanceTo(c1.tgt)+Math.abs(Math.log(c0.pos.distanceTo(c0.tgt)/c1.pos.distanceTo(c1.tgt)));
 const SUB=Number(Q.get('mb')||(LINEUP||Q.get('dbg')||Q.get('eye')?1:(mv>.008?20:4)));for(let i=0;i<SUB;i++){const ts=t+(i/SUB-.5)*.9/FPS;if(i){applyState(ts);const c=camAtT(ts);cam.position.copy(c.pos);cam.up.copy(c.up);cam.lookAt(c.tgt);}
  comp.render();cx.globalAlpha=1/(i+1);cx.drawImage(glc,0,0);}
 return true;};
let LINEUP=false;if(Q.get('lineup')){const L_=[MAN,...Object.values(CAST)];if(Q.get('only')){const k=Q.get('only').split(',');for(const [n,c] of Object.entries(CAST))c.root.visible=k.includes(n);}L_.forEach((c,i)=>{c.root.position.set(-3.1+i*.9,0,.4);c.root.rotation.set(0,0,0);
  if(c.BN){c.pose('upperarm01L',.08,0,-.85);c.pose('upperarm01R',.08,0,.85);c.pose('lowerarm01L',.06,0,0);c.pose('lowerarm01R',.06,0,0);}
  else{const W_=JSON.parse(Q.get('wa')||'[0,0,1.2]');c.pose('LeftArm',...W_);c.pose('RightArm',W_[0],-W_[1],-W_[2]);}});

 LINEUP=true;}
window.renderAt(Number(Q.get('t')||0));document.title='ready';
</script></body></html>
