 if(u<.12){x=AX;dir=0;loaded=u>.06;}else if(u<.5){x=AX+(BX-AX)*(u-.12)/.38;dir=1;loaded=true;}else if(u<.6){x=BX;dir=0;loaded=u<.54;}else{x=BX+(AX-BX)*(u-.6)/.4;dir=-1;loaded=false;}
 return {x,dir,loaded,del:c+(u>=.54?1:0)};}
function animate(t){
 const st=(t%.5)/.5;sheet.position.set(PRX,1.0+.2*(1-st),PRZ+.45+st*.5);for(const r of rollers)r.rotation.x=-t*10;
 drawDebt(t);waveFlags(t);
 for(const P of everyone){relaxArms(P);pose(P,'spine03',.015*Math.sin(t*1.8+P.ph),0,0);curl(P,'L',.35);curl(P,'R',.35);for(const n of['upperleg01L','upperleg01R','lowerleg01L','lowerleg01R'])pose(P,n,0,0,0);}
 // official: speech gestures, turns to the board on "debt"
 {const g1=Math.sin(t*3.1),g2=Math.sin(t*2.3+1);pose(gov,'upperarm01R',.55+.25*g1,0,.55);pose(gov,'lowerarm01R',.9+.25*g1,0,0);
  pose(gov,'upperarm01L',.5+.2*g2,0,-.55);pose(gov,'lowerarm01L',.8+.2*g2,0,0);pose(gov,'head',.04*Math.sin(t*4),-.12*Math.sin(t*1.3),0);curl(gov,'L',.25);curl(gov,'R',.25);}
 // worker
 const w=worker(t);wk.g.position.set(w.x,0,WZ);wk.g.rotation.y=w.dir>0?Math.PI/2:w.dir<0?-Math.PI/2:Math.PI;
 if(w.dir){walkLegs(wk,w.x*4.6,.42);}
 if(w.loaded){armsP(wk,'carry');curl(wk,'L',.6);curl(wk,'R',.6);}else if(w.dir){const ph=w.x*4.6;pose(wk,'upperarm01L',AD[0]+.3*Math.sin(ph),0,-AD[2]);pose(wk,'upperarm01R',AD[0]-.3*Math.sin(ph),0,AD[2]);}
 // the tray refills, the pile grows by 4 bricks per delivery
 trayStack.forEach((m,i)=>m.visible=i<2+Math.floor(((t+1.0)%CY)/CY*8));
 pile.forEach((m,i)=>m.visible=i<4+w.del*4);
 {const k=Math.min(1,t/3.4),e=k*(2-k);pm.g.position.set(PX+1.2-.6*e,0,5.5-3.3*e);pm.g.rotation.y=Math.PI+.15-.1*e;
  if(k<1){const ph=t*7.2;walkLegs(pm,ph,.4*(1-Math.pow(k,6)));pose(pm,'upperarm01L',AD[0]+.28*Math.sin(ph),0,-AD[2]);pose(pm,'upperarm01R',AD[0]-.28*Math.sin(ph),0,AD[2]);}}
 // Mike: follows the worker with his head; surprised on "debt", hands to head on the number
 const td=Wn('debt'),tn=Wn('$40.6');const sur=Math.min(1,Math.max(0,(t-td)/.25));
 pose(pm,'head',-.05-.25*sur,Math.max(-.5,Math.min(.5,(w.x-pm.g.position.x)*.15))*(1-sur),0);
 if(t>=td){pose(pm,'upperarm01L',AD[0]+.7*sur,0,-AD[2]+.25*sur);pose(pm,'upperarm01R',AD[0]+.7*sur,0,AD[2]-.25*sur);pose(pm,'lowerarm01L',1.3*sur,0,0);pose(pm,'lowerarm01R',1.3*sur,0,0);}
 if(t>=tn){const k=Math.min(1,(t-tn)/.3);pose(pm,'lowerarm01L',1.3+.5*k,0,0);pose(pm,'lowerarm01R',1.3+.5*k,0,0);pose(pm,'head',-.3-.05*k,0,0);}
 for(const P of everyone)P.g.updateMatrixWorld(true);
 wk.BN['wristR'].getWorldPosition(tmp);wk.BN['wristL'].getWorldPosition(tmp2);carry.position.copy(tmp).add(tmp2).multiplyScalar(.5).add(V3(0,.04,0));carry.rotation.y=wk.g.rotation.y;carry.visible=w.loaded;
 // floating labels
 const pw=Wn('print'),dw=td;
 TPRINT.scale.setScalar(t<4.0?pop(t,pw,.3):Math.max(0,1-(t-4.0)/.3));TPRINT.position.set(PRX,1.85+.03*Math.sin(t*3),PRZ+.2);TPRINT.lookAt(camP);
 TDEBT.scale.setScalar(t<4.0?pop(t,Wn('pay'),.3):Math.max(0,1-(t-4.0)/.3));TDEBT.position.set(PLX,1.55+.03*Math.sin(t*3+1),PLZ);TDEBT.lookAt(camP);
 T406.scale.setScalar(pop(t,tn,.32));T406.position.set(PX,1.88,-2.4);T406.lookAt(camP);
}
const cam=new THREE.PerspectiveCamera(40,W/H,.05,200);
const sun=new THREE.DirectionalLight(0xffe0b8,1.5);sun.position.set(-9,7,5);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:6,bottom:-6,near:1,far:40});sun.shadow.bias=-.0003;sun.shadow.normalBias=.02;scene.add(sun);scene.add(sun.target);
scene.add(new THREE.HemisphereLight(0xdfe9ff,0x5a4630,.3));
const key=new THREE.SpotLight(0xfff2e0,9,8,.5,.6,1.5);key.position.set(PX+1.5,3.2,2.5);key.target.position.set(PX,1.3,-1.2);scene.add(key);scene.add(key.target);
const comp=new EffectComposer(renderer);comp.setPixelRatio(PR);comp.setSize(W,H);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.45,.18,1.3));
const bokeh=new BokehPass(scene,cam,{focus:3,aperture:.004,maxblur:.006});comp.addPass(bokeh);comp.addPass(new OutputPass());
renderer.toneMappingExposure=1.1;scene.environmentIntensity=.7;scene.backgroundIntensity=.7;
scene.add(new THREE.HemisphereLight(0xe6efff,0x6a5638,.9));
// ONE continuous camera: knots [t, pos, look, fov]; smooth (Catmull-Rom) through all of them, never a cut
const KN=[
 [0.0, [PX+.15,2.15,10.6],[PX,2.55,-3.0],50],    // frontal wide: board, building, printer | podium | pile, Mike foreground right
 [2.3, [PX+.1,2.0,9.0],[PX,2.7,-3.0],49],        // follow Mike walking in, "print money"
 [3.7, [PX,1.8,7.3],[PX,2.95,-4.2],47],          // "can't pay off its debt" -> tilt up to the board
 [5.2, [PX-.25,1.5,5.7],[PX+.05,2.95,-4.2],47],  // low angle over Mike's shoulder: "$40.6 trillion"
 [7.0, [PX-.3,1.45,5.2],[PX+.05,2.8,-4.2],46]];  // (next line: down to Mike, "your share")
const cr=(p0,p1,p2,p3,u)=>.5*(2*p1+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u);
function knot(t){let i=0;while(i<KN.length-2&&t>=KN[i+1][0])i++;const a=KN[Math.max(0,i-1)],b=KN[i],c=KN[i+1],d=KN[Math.min(KN.length-1,i+2)];
 let u=Math.min(1,Math.max(0,(t-b[0])/(c[0]-b[0])));u=u*u*(3-2*u)*.35+u*.65;
 const f=j=>[0,1,2].map(q=>cr(a[j][q],b[j][q],c[j][q],d[j][q],u));return [f(1),f(2),cr(a[3],b[3],c[3],d[3],u)];}
function setCam(t){const [p,l,fv]=knot(t);cam.position.set(...p);const lk=V3(...l);cam.fov=fv;cam.updateProjectionMatrix();cam.lookAt(lk);camP=cam.position.clone();
 bokeh.uniforms.focus.value=cam.position.distanceTo(lk);bokeh.uniforms.aperture.value=.0006;}
await loaded;
const cap=document.getElementById('cap');
window.renderAt=t=>{setCam(t);animate(t);
 let c=CH[0];for(const x of CH)if(t>=x.s-.03)c=x;cap.textContent=c.t;const wa=t-c.s;cap.style.transform=`scale(${wa<.08?.86+wa/.08*.14:1})`;
 comp.render();return true;};
window.renderAt(Number(Q.get('t')||0));document.title='ready';
