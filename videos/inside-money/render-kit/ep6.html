// ================= STATIONS =================

 add(B(.62,.36,.02),M(0x111111,.4),0,.98,.27,P,false);add(RB(.18,.4,.12,.03),M(0x202020,.5),.5,1.1,.1,P);
 const hose=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V3(.42,.9,.3),V3(.62,.6,.5),V3(.4,.55,.85),V3(-.1,.95,.95)]),30,.025,8);add(hose,M(0x111111,.6),0,0,0,P,false);
 // price sign behind the pump: dark panel + glowing 3D price (Zack glow rule)
 add(B(.12,2.7,.12),M(0xcfcfcf,.4,.5),X-1.1,1.35,-1.4);add(B(.12,2.7,.12),M(0xcfcfcf,.4,.5),X+1.1,1.35,-1.4);add(RB(2.7,1.25,.14,.06),M(0x14161c,.5),X,3.05,-1.4);
 const pr=big(txt,.62,hex,2.2);pr.position.set(X,2.8,-1.28);

}
const sUS=station(US,SIGN[0],'$4.15',flagT,0x1e5ab8),sIR=station(IR,SIGN[1],'$0.11',irT,0x239f40);
// ================= CAST =================
const gl=new GLTFLoader(),SRC={};
for(const n of['mike','landlord']){const g=(await gl.loadAsync(`dl/models/cast/${n}.glb`)).scene;
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;const mt=o.material;
  if(mt.normalMap&&/bump/i.test(mt.normalMap.name)){mt.normalMap=null;mt.needsUpdate=true;}
  if(mt.transparent||/hair|brow|lash|ponytail|bob|short|bun|messy|braid/i.test(o.name+mt.name)){mt.transparent=false;mt.alphaTest=.45;mt.depthWrite=true;mt.side=THREE.DoubleSide;}}});SRC[n]=g;}
const qx=new THREE.Quaternion(),E=new THREE.Euler();window.missingBones=[];
function pose(P,n,x,y,z){const b=P.BN[n];if(!b){if(!window.missingBones.includes(n))window.missingBones.push(n);return;}b.quaternion.copy(P.rest.get(b));qx.setFromEuler(E.set(x,y,z));b.quaternion.multiply(qx);}
const AD=[0.12,0,0.72],FC=[1,0,0];
function curl(P,side,v,thumb=v*.6){for(const [n] of Object.entries(P.BN)){const m=n.match(/^finger(\d)-(\d)(L|R)$/);if(!m||m[3]!==side)continue;
 const k=(m[1]==='1'?thumb:v)*(m[2]==='1'?.7:1);pose(P,n,FC[0]*k,FC[1]*k,FC[2]*k*(side==='L'?-1:1));}}
function person(name,x,z,ry){const g=skClone(SRC[name]);g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
 const BN={};g.traverse(o=>{if(o.isBone)BN[o.name]=o;});const rest=new Map();for(const b of Object.values(BN))rest.set(b,b.quaternion.clone());return {g,BN,rest,ph:rr()*6.28};}

const mike=person('mike',US+.15,1.15,Math.PI),guy=person('landlord',IR-.15,1.15,Math.PI);
// ================= TIMELINE =================
const TLN=await (await fetch('timeline_ep6.json')).json(),WD=TLN.words,CH=TLN.chunks;
const Wn=(w,n=0)=>{const k=WD.filter(x=>x.w.toLowerCase().replace(/[^a-z0-9$]/g,'')===w);return (k[n]||k[k.length-1]||{s:0}).s;};

const camP0=V3(0,0,0);let camP=V3(0,0,0);
function driver(P,t,on,reactT){for(const n of['upperleg01L','upperleg01R','lowerleg01L','lowerleg01R'])pose(P,n,0,0,0);relaxArms(P);
 const br=Math.sin(t*2.1+P.ph),holding=1-sm(reactT,reactT+.25,t),react=sm(reactT,reactT+.3,t);

 pose(P,'upperarm01L',AD[0]+.25*holding+1.1*react,0,-AD[2]+.1+.55*react);pose(P,'lowerarm01L',.4*holding+.3*react,0,0);curl(P,'L',.3);

 const reactUS=tIran-.9,reactIR=tIran+.7;

 {const v=pop(t,tTr-.05,.3);sUS.pr.visible=v>.002;sUS.pr.scale.setScalar(Math.max(v,.002));sUS.pr.position.y=2.8+.03*Math.sin(t*3);}
 {const v=pop(t,tIran-.05,.3);sIR.pr.visible=v>.002;sIR.pr.scale.setScalar(Math.max(v,.002));sIR.pr.position.y=2.8+.03*Math.sin(t*3);}

const comp=new EffectComposer(renderer);comp.setPixelRatio(PR);comp.setSize(W,H);comp.addPass(new RenderPass(scene,cam));

const D=(p0,p1,l0,l1,f0,f1,ap=.001)=>k=>[L(p0,p1,k),L(l0,l1,k),f0+(f1-f0)*k,ap];

 [tIran-.35,tIran+.1,D([US+1.2,1.9,6.4],[IR-1.2,1.9,6.4],[US,1.95,0],[IR,1.95,0],42,44,.0003)],

 const [p,l,f,a]=S[2](k);cam.position.copy(p);cam.fov=f;cam.updateProjectionMatrix();cam.lookAt(l);camP=cam.position.clone();bokeh.uniforms.focus.value=p.distanceTo(l);bokeh.uniforms.aperture.value=a;}
