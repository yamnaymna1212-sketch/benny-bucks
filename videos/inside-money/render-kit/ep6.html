// monotone cubic (Fritsch-Carlson) per component, time-based: smooth, never overshoots on the long fly-over
function mono(vals){const n=KN.length,T=KN.map(k=>k[0]),d=[],m=[];for(let i=0;i<n-1;i++)d.push((vals[i+1]-vals[i])/(T[i+1]-T[i]));
 for(let i=0;i<n;i++){if(i===0)m.push(d[0]*.5);else if(i===n-1)m.push(d[n-2]*.5);else m.push(d[i-1]*d[i]<=0?0:2/(1/d[i-1]+1/d[i]));}return m;}
const KC=[];for(const j of[1,2])for(const q of[0,1,2]){const v=KN.map(k=>k[j][q]);KC.push([v,mono(v)]);}{const v=KN.map(k=>k[3]);KC.push([v,mono(v)]);}
function knot(t){const T=KN.map(k=>k[0]);let i=0;while(i<T.length-2&&t>=T[i+1])i++;const h=T[i+1]-T[i],u=Math.min(1,Math.max(0,(t-T[i])/h));
 const H=([v,m])=>{const u2=u*u,u3=u2*u;return (2*u3-3*u2+1)*v[i]+(u3-2*u2+u)*h*m[i]+(-2*u3+3*u2)*v[i+1]+(u3-u2)*h*m[i+1];};
 const r=KC.map(H);return [r.slice(0,3),r.slice(3,6),r[6]];}
